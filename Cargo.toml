[package]
name = "ai-pcb"
version = "0.1.0"
edition = "2024"
description = "A local-first PCB concept design workbench"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
fs2 = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "sync", "process", "time"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
